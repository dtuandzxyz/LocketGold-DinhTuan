#!name=LocketGold-DinhTuan-AIFilter
#!desc=Locket Gold VIP + AI Filter Module - By dtuandzxyz
#!distributor=dtuandzxyz
#!author=dtuandzxyz
# 🚀 Maintained by: dtuandzxyz
#!icon=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Locket.png
#!system=ios

[Rule]
# Chặn QUIC/UDP cho Locket
AND,((DOMAIN,firebaseremoteconfig.googleapis.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN,api.revenuecat.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN,api.locketcamera.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN-SUFFIX,locketcamera.com),(PROTOCOL,UDP)),REJECT

# Chặn Sentry
DOMAIN-SUFFIX,sentry.io,REJECT
DOMAIN-SUFFIX,ingest.sentry.io,REJECT

[Header Rewrite]
# Xóa Cache / ETag trên RevenueCat
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers) header-del x-revenuecat-etag
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers) header-del X-RevenueCat-ETag
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers) header-del if-none-match
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers) header-del If-None-Match
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers) header-del if-modified-since
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers) header-del If-Modified-Since

# Xóa Cache / ETag trên Firebase Remote Config
^https?:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+ header-del if-none-match
^https?:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+ header-del If-None-Match
^https?:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+ header-del if-modified-since
^https?:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+ header-del If-Modified-Since
^https?:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+ header-del x-goog-if-none-match

# Xóa Cache / ETag trên Locket Camera API
^https?:\/\/api\.locketcamera\.com\/.+ header-del if-none-match
^https?:\/\/api\.locketcamera\.com\/.+ header-del If-None-Match
^https?:\/\/api\.locketcamera\.com\/.+ header-del if-modified-since
^https?:\/\/api\.locketcamera\.com\/.+ header-del If-Modified-Since

[Script]
# [1] Xóa Header RevenueCat
deleteHeader_RC = type=http-request,pattern=^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers),script-path=https://raw.githubusercontent.com/dtuandzxyz/LocketGold-DinhTuan/main/js/deleteHeader_RC.js,timeout=60

# [2] Xóa Header Firebase
deleteHeader_Firebase = type=http-request,pattern=^https?:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+,script-path=https://raw.githubusercontent.com/dtuandzxyz/LocketGold-DinhTuan/main/js/deleteHeader_Firebase.js,timeout=60

# [3] AI Filter Request Handler — Remap filter ID + inject prompt (MỚI)
locket_pb_req = type=http-request,pattern=^https?:\/\/api\.locketcamera\.com\/(generateFilteredImage|photoboothMoment|photobooth),requires-body=true,max-size=-1,script-path=https://raw.githubusercontent.com/dtuandzxyz/LocketGold-DinhTuan/main/js/locket_pb_req.js,timeout=60

# [4] RevenueCat — Giả lập gói subscription
revenuecat = type=http-response,pattern=^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers),script-path=https://raw.githubusercontent.com/dtuandzxyz/LocketGold-DinhTuan/main/js/revenuecat.js,requires-body=true,max-size=-1,timeout=60

# [5] Firebase Remote Config — Mở khóa tính năng Gold + AI Filter
locket_rc = type=http-response,pattern=^https:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+,script-path=https://raw.githubusercontent.com/dtuandzxyz/LocketGold-DinhTuan/main/js/locketfix.js,requires-body=true,max-size=-1,timeout=60

# [6] Huy hiệu Profile Gold
locket_change_profile = type=http-request,pattern=^https:\/\/api\.locketcamera\.com\/changeProfileInfo,script-path=https://raw.githubusercontent.com/dtuandzxyz/LocketGold-DinhTuan/main/js/locket_change_profile.js,timeout=60

# [7] Locket API Response — Unblur + VIP Gold + AI Filter Unlock (MỚI: xử lý generateFilteredImage)
locket_filter_resp = type=http-response,pattern=^https?:\/\/api\.locketcamera\.com\/.+,requires-body=true,max-size=-1,script-path=https://raw.githubusercontent.com/dtuandzxyz/LocketGold-DinhTuan/main/js/locket_filter_resp.js,timeout=60

[Host]
firebaseremoteconfigrealtime.googleapis.com = 0.0.0.0

[MITM]
hostname = %APPEND% api.revenuecat.com, firebaseremoteconfig.googleapis.com, api.locketcamera.com, *.locketcamera.com
